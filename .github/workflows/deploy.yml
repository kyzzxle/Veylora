# Builds the Astro site and publishes it to GitHub Pages at https://veyloralab.tech
# every time main is pushed (or when run by hand from the Actions tab).
#
# One-time setup in the repository on GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Pages → Custom domain: veyloralab.tech, then tick "Enforce HTTPS"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build the site
        run: npm run build
        env:
          SITE_URL: https://veyloralab.tech

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
